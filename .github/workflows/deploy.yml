name: Deploy delatierra to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Sync to hosting via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc
          {
            echo "set ftp:ssl-allow yes"
            echo "set ftp:ssl-force true"
            echo "set ssl:verify-certificate no"
            echo "set xfer:clobber on"
            echo "set net:timeout 60"
            echo "open ${FTP_SERVER}"
            echo "mirror -R --ignore-time --verbose \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob app/config.local.php \
              --exclude-glob omniflow_config.php \
              --exclude-glob public/uploads/ \
              --exclude-glob .deploy.env \
              ./ public_html/"
            echo "quit"
          } > /tmp/deploy.lftp
          lftp -f /tmp/deploy.lftp
          rm -f ~/.netrc
